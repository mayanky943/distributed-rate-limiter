logging:
  level:
    com.mayanky943.ratelimiter: DEBUG
    org.springframework.data.redis: INFO

ratelimit:
  enabled: true
  default-algorithm: TOKEN_BUCKET
  rules:
    - name: dev-per-ip
      scope: IP
      algorithm: TOKEN_BUCKET
      capacity: 20
      refill-tokens: 20
      refill-period-seconds: 60
      path-pattern: "/api/**"
